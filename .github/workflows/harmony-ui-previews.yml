name: Harmony UI previews
on:
  push:
    branches: [ui-preview-capture]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      GIT_LFS_SKIP_SMUDGE: 1
      PREVIEW_FONT_DIR: ${{ github.workspace }}/build/preview-fonts
      PREVIEW_OUTPUT_DIR: ${{ github.workspace }}/build/ui-previews
    steps:
      - uses: actions/checkout@v4
      - name: Setup OpenHarmony SDK
        uses: ErBWs/setup-ohos@v2.0.0
        with:
          version: '26.0.0.821'
          cache: true
      - name: Setup Flutter with OpenHarmony support
        id: flutter
        uses: tljk/flutter-action@main
        with:
          channel: oh-3.47.7-preview
          flutter-version: '3.47.7+ohos-0.0.1-pre'
          git-source: https://gitcode.com/CPF-Flutter/flutter_flutter.git
          cache: true
          pub-cache: true
      - name: Restore render dependency cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
          key: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}
      - run: bash .github/revert_flutter_ohos.sh
      - name: Prepare render-only configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("pubspec.yaml")
          text = path.read_text()
          assert text.count("build_assets: true") == 2
          path.write_text(text.replace("build_assets: true", "build_assets: false"))
          path = Path("lib/common/system.dart")
          text = path.read_text()
          for name in ("Windows", "MacOS", "Android", "Linux"):
              before = f"bool get is{name} => Platform.is{name};"
              assert before in text
              text = text.replace(before, f"bool get is{name} => false;")
          text = text.replace("bool get isOhos => Platform.operatingSystem == 'ohos';", "bool get isOhos => true;")
          path.write_text(text)
          path = Path("lib/enum/enum.dart")
          path.write_text(path.read_text().replace("else if (Platform.isLinux)", "else if (system.isLinux)"))
          PY
      - name: Download HarmonyOS preview fonts
        run: |
          mkdir -p "$PREVIEW_FONT_DIR"
          for weight in Regular Medium Bold; do
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/IKKI2000/harmonyos-fonts/main/fonts/HarmonyOS_Sans_SC/HarmonyOS_Sans_SC_${weight}.ttf" -o "$PREVIEW_FONT_DIR/HarmonyOS_Sans_SC_${weight}.ttf"
          done
      - name: Install dependencies
        run: flutter pub get
      - name: Render Harmony phone and tablet previews
        run: flutter test test/_harmony_ui_preview_capture_test.dart --reporter expanded --concurrency 1
      - name: Restore native platform conditions for regression checks
        run: git restore lib/common/system.dart lib/enum/enum.dart
      - name: Analyze polished interface
        run: flutter analyze --no-fatal-infos lib
      - name: Run interface and action regressions
        run: flutter test test/widgets/interface_redesign_test.dart test/widgets/navigation_dock_test.dart test/widgets/proxy_card_focus_test.dart test/widgets/proxies_list_test.dart test/views/proxies_group_offsets_test.dart test/widgets/connections_view_test.dart --reporter expanded --concurrency 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harmony-ui-previews
          path: build/ui-previews/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve Flutter cache for rendering
        if: always() && steps.flutter.outputs.CACHE-HIT != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.flutter.outputs.CACHE-PATH }}
          key: ${{ steps.flutter.outputs.CACHE-KEY }}
      - name: Preserve dependency cache for rendering
        if: always() && steps.flutter.outputs.PUB-CACHE-HIT != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
          key: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}
