name: HarmonyOS unsigned package
on:
  push:
    branches: [harmony-package-812a007]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: harmony-package-812a007
  cancel-in-progress: false
env:
  FLUTTER_VERSION_OHOS: '3.47.7+ohos-0.0.1-pre'
  FLUTTER_BRANCH_OHOS: 'oh-3.47.7-preview'
  SDK_VERSION: '26.0.0.821'
  GIT_LFS_SKIP_SMUDGE: 1
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '812a0071a5a8c9e677103ba525ca1e61de98278f'
          submodules: recursive
      - name: Verify source
        run: test "$(git rev-parse HEAD)" = 812a0071a5a8c9e677103ba525ca1e61de98278f
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum
      - name: Setup OpenHarmony Go
        run: |
          git clone -b v0.1.0 --depth 1 https://github.com/DreamistW/go-ohos-port.git "$RUNNER_TEMP/go-ohos-port"
          python3 "$RUNNER_TEMP/go-ohos-port/scripts/prepare-toolchain.py" "$RUNNER_TEMP/ohos-go"
          echo "GOROOT=$RUNNER_TEMP/ohos-go/go" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ohos-go/go/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: harmony-package
          workspaces: |
            plugins/rust_api/rust
            services/helper
          cache-directories: .dart_tool/hooks_runner
      - name: Setup OpenHarmony SDK
        uses: ErBWs/setup-ohos@v2.0.0
        with:
          version: ${{ env.SDK_VERSION }}
          cache: true
      - name: Setup Flutter OpenHarmony
        uses: tljk/flutter-action@main
        with:
          channel: ${{ env.FLUTTER_BRANCH_OHOS }}
          flutter-version: ${{ env.FLUTTER_VERSION_OHOS }}
          git-source: https://gitcode.com/CPF-Flutter/flutter_flutter.git
          cache: true
          cache-key: ohos-flutter-:os:-:version:-:arch:-${{ hashFiles('.github/revert_flutter_ohos.sh') }}
          pub-cache: true
      - run: bash .github/revert_flutter_ohos.sh
      - name: Setup Rust target
        run: rustup target add aarch64-unknown-linux-ohos
      - name: Install dependencies
        run: flutter pub get
      - name: Build unsigned release HAP
        run: dart setup.dart ohos --env stable --targets hap --arch arm64 -v
      - name: Validate and collect HAP
        env:
          SOURCE_SHA: 812a0071a5a8c9e677103ba525ca1e61de98278f
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, zipfile
          from pathlib import Path
          files = list(Path('dist').rglob('*.hap'))
          assert len(files) == 1, files
          src = files[0]
          with zipfile.ZipFile(src) as hap:
              assert hap.testzip() is None
              names = hap.namelist()
              assert 'module.json' in names, names
              assert any(n.endswith('/libapp.so') for n in names), 'Missing release AOT library'
              assert any(n.endswith('/libflutter.so') for n in names), 'Missing Flutter engine'
          out = Path('package-output'); out.mkdir(exist_ok=True)
          target = out / 'FlClash-0.8.99-ui-v2-812a007-ohos-arm64-unsigned.hap'
          shutil.copy2(src, target)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          (out / 'SHA256SUMS').write_text(digest + '  ' + target.name + chr(10))
          info = dict(source=os.environ['SOURCE_SHA'], signed=False, mode='release', architecture='arm64', run=os.environ['GITHUB_RUN_ID'], sha256=digest, bytes=target.stat().st_size, native_libraries=[n for n in names if n.endswith('.so')])
          (out / 'BUILD-INFO.json').write_text(json.dumps(info, indent=2) + chr(10))
          print(json.dumps(info, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-ui-812a007-unsigned
          path: package-output/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
